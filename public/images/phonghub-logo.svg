<svg width="920" height="240" viewBox="0 0 920 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PhongHub Logo</title>
  <desc id="desc">Logo PhongHub với biểu tượng P và H cách điệu, màu tím thương hiệu, nền trong suốt.</desc>

  <defs>
    <linearGradient id="brandGradient" x1="24" y1="24" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B63FF"/>
      <stop offset="1" stop-color="#7033FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7033FF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Brand mark -->
  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="200" height="200" rx="54" fill="url(#brandGradient)"/>
  </g>

  <!-- P + H monogram -->
  <path d="M72 62V178" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M82 70H126C151 70 168 84 168 106C168 128 151 142 126 142H82" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M142 116V178" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M142 146H188" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M188 116V178" stroke="white" stroke-width="22" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="268" y="146" font-family="Inter, Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#151326">Phong</text>
  <text x="529" y="146" font-family="Inter, Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#7033FF">Hub</text>
</svg>
